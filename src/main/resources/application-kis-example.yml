# Copy the desired values into your application's application.yml or an external config file.
# Never commit plain app keys/secrets: use environment variables or Jasypt ENC(...) values.
kis:
  openapi:
    # PAPER by default. Change to REAL only after checking the selected credentials and account.
    environment: ${KIS_ENVIRONMENT:PAPER}
    paper:
      app-key: ${KIS_PAPER_APP_KEY:}
      app-secret: ${KIS_PAPER_APP_SECRET:}
      account-number: ${KIS_PAPER_ACCOUNT_NUMBER:}
      account-product-code: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:01}
    real:
      app-key: ${KIS_REAL_APP_KEY:}
      app-secret: ${KIS_REAL_APP_SECRET:}
      account-number: ${KIS_REAL_ACCOUNT_NUMBER:}
      account-product-code: ${KIS_REAL_ACCOUNT_PRODUCT_CODE:01}
    domestic-stock-monitor:
      enabled: false
      interval: 1m
      symbols: []
      persistence:
        enabled: false
# MySQL is only needed when domestic-stock-monitor.persistence.enabled is true.
spring:
  datasource:
    url: ${KIS_DB_URL:jdbc:mysql://localhost:3306/kis_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${KIS_DB_USERNAME:kis_service}
    password: ${KIS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
