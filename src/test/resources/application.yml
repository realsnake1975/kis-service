kis:
  openapi:
    environment: ${KIS_ENVIRONMENT:PAPER}
    paper:
      account-number: ${KIS_PAPER_ACCOUNT_NUMBER:}
      account-product-code: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:01}
    real:
      account-number: ${KIS_REAL_ACCOUNT_NUMBER:}
      account-product-code: ${KIS_REAL_ACCOUNT_PRODUCT_CODE:01}
spring:
  datasource:
    url: ${KIS_DB_URL:jdbc:mysql://localhost:3306/kis_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${KIS_DB_USERNAME:kis_service}
    password: ${KIS_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
